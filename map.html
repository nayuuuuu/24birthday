<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>思い出マップ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
   <button class="back-btn" onclick="history.back()"><</button>
  🗾 思い出マップ
</header>

<!-- 地図 -->
<div id="map"></div>

<!-- モーダル -->
<div id="dialog">
  <div class="dialog-box">
      <div id="spotTitle"></div>
    <div id="slider" class="slider"></div>
     <div class="slider-dots"></div>  <!-- 丸ぽち -->
    <p id="spotText"></p>
     <!-- ⭐追加 -->
  <button id="actionBtn">しおりを見る</button>
    <button onclick="closeDialog()">閉じる</button>
  </div>
</div>

<!-- JS（先に読み込む） -->
<script src="map.js"></script>

<!-- Google Maps API（最後） -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA3TxFMjmAV6f99dDftY5XYtuz1fqHm31g&callback=initMap"
  async defer>
</script>

</body>
</html>
